name: Deploy to GitHub Pages

# Deploys on every push to main - the on-the-go device-test surface
# (OnePlus Pad 3 / Cromite). One-time repo setup:
#   Settings -> Pages -> Source: GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stage 0 replaces this with the Vite pipeline:
      #   npm ci && npm run build  (dist/)
      # Remember: set vite `base` to "/<repo-name>/" for project pages.
      - name: Assemble site artifact
        run: |
          mkdir -p dist
          cp -r site/. dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
